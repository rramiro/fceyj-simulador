# Proxy compartido por los dos ambientes: recibe todo el tráfico (puertos 80 y 443),
# saca y renueva los certificados HTTPS y reparte por dominio.
# En el servidor vive en /opt/simulador/proxy/ con su .env (lo arma preparar.sh):
#   DOMINIO_PRODUCCION, DOMINIO_TESTING, CORREO,
#   REST_KEY_PRODUCCION, REST_KEY_TESTING (las mismas que OTREE_REST_KEY de cada ambiente),
#   DOCENTE_HASH_PRODUCCION, DOCENTE_HASH_TESTING (contraseña de administración en bcrypt)

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO_PRODUCCION: ${DOMINIO_PRODUCCION:?falta DOMINIO_PRODUCCION}
      DOMINIO_TESTING: ${DOMINIO_TESTING:?falta DOMINIO_TESTING}
      CORREO: ${CORREO:?falta CORREO}
      REST_KEY_PRODUCCION: ${REST_KEY_PRODUCCION:?falta REST_KEY_PRODUCCION}
      REST_KEY_TESTING: ${REST_KEY_TESTING:?falta REST_KEY_TESTING}
      DOCENTE_HASH_PRODUCCION: ${DOCENTE_HASH_PRODUCCION:?falta DOCENTE_HASH_PRODUCCION}
      DOCENTE_HASH_TESTING: ${DOCENTE_HASH_TESTING:?falta DOCENTE_HASH_TESTING}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web:
    external: true
    name: web

volumes:
  caddy_data: {}
  caddy_config: {}
