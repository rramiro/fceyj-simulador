# Pruebas del simulador: bots de oTree, verificaciones del modelo y huella del esquema.
# Corre en cada push y pull request, y antes de cada despliegue.
name: Pruebas

on:
  push:
    branches-ignore: [main]   # en main las corre el workflow "Despliegue"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pruebas:
    name: Bots y modelo de mercado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt requests

      - name: Bots de oTree (8 empresas, todas las páginas)
        run: otree test comercializacion 8

      - name: Verificaciones y calibración del modelo
        run: python scripts/simular_mercado.py

      - name: Bots de oTree del juego de cartera (6 equipos, 12 trimestres)
        run: otree test cartera 6

      - name: Verificaciones y calibración del modelo de cartera
        run: python scripts/simular_cartera.py

      - name: Bots de oTree del juego de auditoría (4 estudios, 4 etapas)
        run: otree test auditoria 4

      - name: Verificaciones y calibración del modelo de auditoría
        run: python scripts/simular_auditoria.py

      - name: Bots de oTree del juego de costos (4 equipos, 6 meses)
        run: otree test costos 4

      - name: Verificaciones y calibración del modelo de costos
        run: python scripts/simular_costos.py

      - name: Bots de oTree de El depósito (4 equipos, 6 meses)
        run: otree test deposito 4

      - name: Verificaciones y calibración del modelo de inventarios
        run: python scripts/simular_deposito.py

      - name: Catálogo de juegos (portada y tablero) coincide con settings.py
        run: python scripts/verificar_catalogo.py

      - name: Esquema de la base
        run: |
          python scripts/esquema.py
          {
            echo "### Huella del esquema de la base"
            echo ""
            echo "\`$(python scripts/esquema.py --huella)\` — si cambia, desplegar en producción requiere recrear la base."
          } >> "$GITHUB_STEP_SUMMARY"
