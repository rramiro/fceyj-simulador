# Cada push a main: pruebas → imagen Docker → testing (automático) → producción (con aprobación).
# A producción va exactamente la misma imagen que se probó en testing.
#
# Mientras la variable del repositorio DESPLIEGUE_ACTIVO no valga "true" (es decir,
# mientras no esté preparado el servidor), solo se corren las pruebas.
name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez; el que llega después espera (no se cancela).
concurrency:
  group: despliegue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruebas:
    uses: ./.github/workflows/ci.yml

  imagen:
    name: Construir y publicar la imagen
    needs: pruebas
    if: vars.DESPLIEGUE_ACTIVO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen
        id: nombre
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "imagen=$repo:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ steps.nombre.outputs.imagen }}
            ${{ steps.nombre.outputs.repo }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  testing:
    needs: imagen
    uses: ./.github/workflows/desplegar-ambiente.yml
    permissions:
      contents: read
      packages: read
    with:
      ambiente: testing
      imagen: ${{ needs.imagen.outputs.imagen }}
    secrets: inherit

  produccion:
    needs: [imagen, testing]
    uses: ./.github/workflows/desplegar-ambiente.yml
    permissions:
      contents: read
      packages: read
    with:
      ambiente: produccion
      imagen: ${{ needs.imagen.outputs.imagen }}
    secrets: inherit
