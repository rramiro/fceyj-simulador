# Cada push a main: pruebas → imagen Docker → testing (automático) → producción (con aprobación).
# A producción va exactamente la misma imagen que se probó en testing.
#
# Probar una rama en testing antes de unirla a main: Actions → Despliegue → Run workflow,
# elegir la rama. Desde una rama que no es main se despliega SOLO en testing (nunca en
# producción) y la imagen se etiqueta con el nombre de la rama, no con "main". El próximo
# push a main vuelve a poner main en testing.
#
# Interruptores (variables del repositorio):
#   DESPLIEGUE_ACTIVO = "true"   construye la imagen y despliega testing (si no, solo pruebas).
#   PRODUCCION_ACTIVA = "true"   además deja el pase a producción esperando aprobación.
name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

# Concurrencia por ambiente (en cada job de despliegue, más abajo): testing nunca queda
# trabado porque producción esté esperando su aprobación.

permissions:
  contents: read

jobs:
  pruebas:
    uses: ./.github/workflows/ci.yml

  imagen:
    name: Construir y publicar la imagen
    needs: pruebas
    if: vars.DESPLIEGUE_ACTIVO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen
        id: nombre
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Etiqueta móvil: "main" para main; para otra rama, su nombre (solo letras, números, . _ -).
          rama="${GITHUB_REF_NAME,,}"
          movil="${rama//[^a-z0-9._-]/-}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "imagen=$repo:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "movil=$repo:$movil" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ steps.nombre.outputs.imagen }}
            ${{ steps.nombre.outputs.movil }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  testing:
    needs: imagen
    # Un despliegue de testing a la vez; el siguiente espera a que termine.
    concurrency:
      group: despliegue-testing
      cancel-in-progress: false
    uses: ./.github/workflows/desplegar-ambiente.yml
    permissions:
      contents: read
      packages: read
    with:
      ambiente: testing
      imagen: ${{ needs.imagen.outputs.imagen }}
    secrets: inherit

  produccion:
    needs: [imagen, testing]
    # Producción se activa con la variable del repositorio PRODUCCION_ACTIVA = "true".
    # Mientras no exista (o valga otra cosa), cada push solo despliega testing.
    # Solo desde main: una rama de prueba nunca llega a producción.
    if: vars.PRODUCCION_ACTIVA == 'true' && github.ref == 'refs/heads/main'
    # Un despliegue de producción a la vez. Mientras uno espera aprobación, la versión más
    # nueva queda en cola (GitHub conserva solo la última en cola). No se cancela el que está
    # en curso, para no cortar un despliegue a la mitad: para pasar directo a la versión
    # nueva, rechazar la espera vieja en "Review deployments".
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    uses: ./.github/workflows/desplegar-ambiente.yml
    permissions:
      contents: read
      packages: read
    with:
      ambiente: produccion
      imagen: ${{ needs.imagen.outputs.imagen }}
    secrets: inherit
